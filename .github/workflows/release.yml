name: Desktop build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11 xdg-utils
      - run: npm ci
      - run: npm run format:check
      - name: Test and build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test.ps1
          ./scripts/build-desktop.ps1 -SkipFrontend -Package
          New-Item -ItemType Directory -Force release/publish | Out-Null
          Copy-Item release/OpsBuddy/OpsBuddy.exe,release/OpsBuddy-Windows-amd64.zip release/publish/
      - name: Test and build Linux
        if: runner.os == 'Linux'
        run: |
          go test -tags webkit2_41 ./... -count=1
          go vet -tags webkit2_41 ./...
          bash scripts/build-desktop.sh
          bash scripts/test-linux-desktop.sh
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Windows-amd64
          path: release/publish/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: Linux-amd64
          path: release/OpsBuddy-Linux-amd64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum OpsBuddy.exe OpsBuddy-Windows-amd64.zip OpsBuddy-Linux-amd64.tar.gz > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "OpsBuddy $GITHUB_REF_NAME" --notes-file docs/releases/v0.18.0.md --prerelease
